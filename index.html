<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>qr-react</title>
    <link rel="manifest" href="/simple-qr-scanner/manifest.json" />
    <meta name="theme-color" content="#000000" />
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/simple-qr-scanner/service-worker.js", {
              scope: "/simple-qr-scanner/",
            })
            .then((registration) => {
              console.log("Service Worker registrado:", registration);
            })
            .catch((error) => {
              console.log("Error al registrar Service Worker:", error);
            });
        });
      }
    </script>
    <script type="module" crossorigin src="/simple-qr-scanner/assets/index-CBZmnbIg.js"></script>
    <link rel="stylesheet" crossorigin href="/simple-qr-scanner/assets/index-BkpfB4yB.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
